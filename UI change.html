<!doctype html>
<html lang = "en">
    <head>
        <meta charset = "utf-8">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
        <script src="js/lib.js"></script>
        <title>UI Change</title>
    </head>

    <body>
        <div class="container mt-5">
            <div class="row bg-white p-4 rounded shadow">
                
                <div class="col-md-5 border-end pe-4">
                    <h4 class="mb-3 text-primary fw-bold">UI Control Panel</h4>
                    
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Title</label>
                        <input type="text" id="input-title" class="form-control" value="Intel Core i9" oninput="updateCard()">
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Background color</label>
                        <input type="color" id="input-bg" class="form-control form-control-color w-100" value="#0d6efd" oninput="updateCard()">
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Text color</label>
                        <input type="color" id="input-color" class="form-control form-control-color w-100" value="#ffffff" oninput="updateCard()">
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Border radius: <span id="radius-val">15</span>px</label>
                        <input type="range" id="input-radius" class="form-range" min="0" max="50" value="15" oninput="updateCard()">
                    </div>
                </div>
                
                <div class="col-md-7 d-flex align-items-center justify-content-center bg-light rounded p-4">
                    <div id="preview-card" style="width: 320px; padding: 25px; background-color: #0d6efd; color: #ffffff; border-radius: 15px; transition: 0.1s;">
                        <span class="badge bg-warning text-dark mb-2">New Tech</span>
                        <h3 id="preview-title" class="fw-bold">Intel Core i9</h3>
                        <p class="small mb-0 opacity-75">This card is changing based on the settings on the left bar, that's how HTML DOM works.</p>
                    </div>
                </div>

            </div>
        </div>
    </body>
</html>
